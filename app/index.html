<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platinum Desk — GTA VI Trophy Field Desk</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header id="top-bar">
        <h1>PLATINUM DESK</h1>
        <p class="subtitle">A field desk for the GTA VI platinum</p>
        <p id="progress-line"></p>
        <div class="controls">
            <button id="export-btn">Export progress</button>
            <button id="import-btn">Import progress</button>
            <input type="file" id="import-file" hidden accept="application/json">
            <label id="veil-wrap"><input type="checkbox" id="veil-toggle"> Spoiler veil</label>
        </div>
    </header>

    <section id="itinerary-root"></section>

    <section id="watchlist-root">
        <h2>WATCH LIST — filed in red</h2>
        <div id="watch-chips"></div>
    </section>

    <nav id="filter-bar">
        <button class="chip" data-filter="all">All</button>
        <button class="chip" data-filter="story">Story</button>
        <button class="chip" data-filter="missable">Missable</button>
        <button class="chip" data-filter="collectibles">Collectibles</button>
        <button class="chip" data-filter="activities">Activities</button>
        <button class="chip" data-filter="completion">Completion</button>
        <input id="search-box" type="search" placeholder="Search the desk">
    </nav>

    <div id="desk-workspace">
        <table id="desk-table">
            <thead>
                <tr>
                    <th>Filed</th>
                    <th>Grade</th>
                    <th>Trophy</th>
                    <th>Kind</th>
                    <th>Stage</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody id="desk-body"></tbody>
        </table>
        <aside id="field-note">
            <p>Select a trophy on the desk to read its field notes.</p>
        </aside>
    </div>

    <footer id="sources-rail">
        <h2>SOURCES — every field note cites its source</h2>
        <div id="sources-list"></div>
        <p id="audit-line"></p>
    </footer>

    <script src="js/desk-store.js"></script>
    <script src="js/veil.js"></script>
    <script src="js/desk-filters.js"></script>
    <script src="js/desk-table.js"></script>
    <script src="js/field-note.js"></script>
    <script src="js/itinerary.js"></script>
    <script src="js/watchlist.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
